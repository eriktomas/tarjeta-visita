<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Erik Tomás · Voltamper</title>
<meta name="description" content="Tarjeta de contacto de Erik Tomás — Business Controller en Voltamper">

<link rel="icon" type="image/png" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --rojo:#E40918;
    --rojo-oscuro:#b30713;
    --tinta:#1d1a1a;
    --gris:#6F6F6E;
    --linea:#ece9e8;
    --suave:#f6f4f3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Archivo','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:var(--tinta);
    background:#fff;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;
  }
  a{color:inherit;text-decoration:none}

  /* banda superior roja y negra, como la tarjeta impresa */
  .banda{align-self:stretch;height:10px;display:flex;flex:none}
  .banda span:first-child{flex:62;background:var(--rojo)}
  .banda span:last-child{flex:38;background:var(--tinta)}

  .tarjeta{
    width:min(420px,100%);flex:1;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 22px 26px;
  }

  .aparece{opacity:0;animation:sube .6s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.38s}
  .d4{animation-delay:.5s}.d6{animation-delay:.78s}

  /* ── sello giratorio con el logo ── */
  .sello{position:relative;width:176px;height:176px;flex:none}
  .sello svg{position:absolute;inset:0;animation:girar 30s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .sello svg text{font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:5px;fill:var(--gris)}
  .logo{
    position:absolute;inset:28px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--rojo), 0 12px 26px rgba(228,9,24,.18);
  }
  .logo img{width:74px;height:auto;display:block}

  /* ── identidad ── */
  h1{
    margin-top:18px;text-align:center;
    font-family:'Fraunces',serif;font-weight:650;
    font-size:clamp(28px,8.2vw,34px);line-height:1.05;letter-spacing:-.4px;
  }
  h1 .apellido{color:var(--rojo)}
  .cargo{margin-top:6px;font-size:15px;font-weight:600}

  /* ── accesos rápidos ── */
  .accesos{margin-top:20px;align-self:stretch;display:flex;gap:10px}
  .acceso{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:13px 6px;border-radius:14px;background:var(--suave);
    font-size:13.5px;font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }
  .acceso:active{transform:scale(.96);background:#ece8e6}
  .acceso svg{color:var(--rojo)}

  /* ── datos ── */
  .datos{margin-top:16px;align-self:stretch;display:flex;flex-direction:column}
  .dato{padding:10px 0;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:1px}
  .dato:last-child{border-bottom:1px solid var(--linea)}
  .dato small{font-size:12px;color:var(--gris)}
  .dato span{font-size:15px;font-weight:500;line-height:1.35}

  .relleno{flex:1;min-height:22px}

  /* ── guardar contacto ── */
  .btn-principal{
    align-self:stretch;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:17px 20px;border-radius:14px;
    background:var(--rojo);color:#fff;font-size:17px;font-weight:700;
    opacity:0;
    animation:sube .6s cubic-bezier(.22,1,.36,1) .62s forwards, latido 2.4s ease-out 1.4s infinite;
    transition:transform .15s ease, background .15s ease;
  }
  @keyframes latido{
    0%{box-shadow:0 0 0 0 rgba(228,9,24,.45)}
    70%{box-shadow:0 0 0 14px rgba(228,9,24,0)}
    100%{box-shadow:0 0 0 0 rgba(228,9,24,0)}
  }
  .btn-principal:active{transform:scale(.97);background:var(--rojo-oscuro)}
  .pie{margin-top:10px;text-align:center;font-size:13px;color:var(--gris)}

  /* ── cambio de idioma (solo en las tarjetas que lo llevan) ── */
  .idiomas{margin-top:8px;display:flex;align-items:center;gap:2px;color:var(--gris)}
  .idiomas svg{margin-right:4px}
  .idioma{
    padding:6px 8px;border:none;border-radius:999px;background:none;cursor:pointer;
    font:inherit;font-size:12.5px;color:var(--gris);
  }
  .idioma[aria-pressed="true"]{color:var(--tinta);font-weight:700}
  .idioma:active{background:var(--suave)}
  .idiomas .sep{font-size:12px;opacity:.6}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .aparece,.btn-principal{opacity:1}
  }
</style>
</head>
<body>

<div class="banda"><span></span><span></span></div>

    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>

<script>
  // Cambio de idioma. Arranca en el idioma del móvil (o el de ?lang=), si la tarjeta lo tiene
  (function () {
    var disponibles = ["es", "en", "zh"];
    var titulos = {"es": "Erik Tomás · Voltamper", "en": "Erik Tomás · Voltamper", "zh": "Erik Tomás · Voltamper 名片"};
    var codigos = { es: 'es', en: 'en', zh: 'zh-Hans' };
    var nodos = document.querySelectorAll('[data-i18n]');
    nodos.forEach(function (n) { n.setAttribute('data-es', n.textContent); });
    var btnVcf = document.getElementById('btnVcf');
    var botones = document.querySelectorAll('.idioma');
    function poner(l) {
      nodos.forEach(function (n) { n.textContent = n.getAttribute('data-' + l) || n.getAttribute('data-es'); });
      btnVcf.setAttribute('href', btnVcf.getAttribute('data-vcf-' + l));
      document.documentElement.lang = codigos[l];
      document.title = titulos[l];
      botones.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-idioma') === l ? 'true' : 'false'); });
    }
    botones.forEach(function (b) {
      b.addEventListener('click', function () { poner(b.getAttribute('data-idioma')); });
    });
    var pide = new URLSearchParams(location.search).get('lang');
    var movil = (navigator.language || 'es').slice(0, 2).toLowerCase();
    var elegido = 'es';
    if (pide && disponibles.indexOf(pide) >= 0) elegido = pide;
    else if (movil !== 'es' && disponibles.indexOf(movil) >= 0) elegido = movil;
    else if (movil !== 'es' && disponibles.indexOf('en') >= 0) elegido = 'en';
    poner(elegido);
  })();
</script>

<script>
  // En iPhone, abre sola la ficha de contacto al entrar (solo la primera vez en cada móvil;
  // después queda el botón "Guardar contacto")
  (function () {
    var esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!esIOS) return;
    try {
      if (localStorage.getItem('vcf-abierto-erik-tomas')) return;
      localStorage.setItem('vcf-abierto-erik-tomas', '1');
    } catch (e) {}
    setTimeout(function () { location.href = document.getElementById('btnVcf').getAttribute('href'); }, 1200);
  })();
</script>

</body>
</html>
